[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-chat"
version = "0.1.0"
description = "A terminal AI coding assistant with a beautiful TUI — chat, code, and explore with any AI model."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "cli", "tui", "coding-assistant", "chat", "terminal"]
authors = [
    {name = "懒喵大王喵"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Terminals",
]

dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pygments>=2.17.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
]

[project.scripts]
echo-chat = "echo.cli:app"
echo = "echo.cli:app"
echotui = "echo.cli:run_tui"

[tool.setuptools.packages.find]
include = ["echo*"]

[tool.setuptools.package-data]
echo = ["web_static/*", "web_static/vendor/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
